body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background:
radial-gradient(circle at 20% 10%,rgba(155,128,81,.18),transparent 30%),
repeating-linear-gradient(88deg,transparent 0 18px,rgba(238,230,215,.018) 19px 20px)}
button{font:inherit}

.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}

.meta{margin:22px 0;color:var(--muted);font-size:13px}
.primary,.answer,.ghost,.shareBtn{border:0;border-radius:14px;cursor:pointer}
.primary{background:var(--paper);color:var(--ink);padding:17px 20px;font-weight:800;font-size:17px;box-shadow:0 10px 35px rgba(0,0,0,.25)}
.primary:active,.answer:active{transform:translateY(1px)}
.footnote{font-size:12px;color:#746c62;margin-top:16px}
.knot{width:82px;height:82px;margin:0 auto 12px;border:1px solid rgba(155,128,81,.5);border-radius:50%;position:relative}
.knot:before,.knot:after{content:"";position:absolute;inset:21px;border:1px solid var(--red);transform:rotate(45deg)}
.knot:after{transform:rotate(-45deg)}
.top{display:flex;align-items:center;gap:14px;margin-bottom:44px}
.progress{height:3px;flex:1;background:rgba(238,230,215,.1);overflow:hidden}

.question{margin:auto 0}

.answer{text-align:left;background:var(--card);color:var(--paper);border:1px solid rgba(238,230,215,.11);padding:17px 16px;display:flex;gap:13px;line-height:1.55;transition:.18s}

.back{margin-top:22px;background:transparent;border:0;color:#777067;cursor:pointer;align-self:flex-start}
.analysis{justify-content:center;text-align:center}
.pulse{width:90px;height:90px;border:1px solid var(--red);border-radius:50%;margin:0 auto 28px;animation:pulse 1.3s infinite}
@keyframes pulse{0%{transform:scale(.84);opacity:.3}55%{transform:scale(1);opacity:1}100%{transform:scale(.84);opacity:.3}}
.result{padding-bottom:70px}
.heroResult{text-align:center;padding:38px 0 24px}
.typeLabel{color:var(--gold);font-size:12px;letter-spacing:.12em}
.typeTitle{font-size:36px;line-height:1.15;margin:12px 0}
.quote{font-size:17px;color:#cfc4b4}
.reveal{margin:22px 0;background:linear-gradient(145deg,rgba(109,33,30,.26),rgba(155,128,81,.08));border:1px solid rgba(155,128,81,.25);padding:20px;border-radius:20px;text-align:center}
.sheetWrap{position:relative;margin:0 auto 16px;max-width:100%;background:rgba(0,0,0,.18);border:1px solid rgba(238,230,215,.15);border-radius:16px;overflow:hidden}
.sheetImage{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;background:#111}
.sheetHint{position:absolute;right:10px;bottom:10px;background:rgba(20,17,15,.84);padding:6px 10px;border-radius:999px;font-size:11px;color:var(--paper2);border:1px solid rgba(238,230,215,.12)}
.avatar{width:118px;height:118px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(238,230,215,.22);background:radial-gradient(circle at 50% 35%,rgba(238,230,215,.18),rgba(0,0,0,.18));font-size:42px;color:var(--gold)}
.name{font-size:30px;font-weight:900}
.book{font-size:13px;color:#a99f91;margin-top:4px}

.bookCta .ghost{color:var(--ink);border-color:rgba(23,20,17,.2);width:100%}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#eee6d7;color:#171411;padding:10px 14px;border-radius:10px;font-size:13px;z-index:99}

/* ===== v4 HOME SCREEN ===== */
.home-v4{
  overflow:hidden;
  justify-content:center;
  text-align:center;
  isolation:isolate;
}
.home-v4:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-5;
  background:
    radial-gradient(ellipse at 50% 18%, rgba(224,211,187,.055), transparent 34%),
    linear-gradient(180deg,#171513 0%,#141210 58%,#0d0c0b 100%);
}
.home-v4:after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.42) 100%),
    repeating-linear-gradient(2deg, rgba(238,230,215,.012) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(91deg, rgba(238,230,215,.008) 0 1px, transparent 1px 19px);
}
.home-grain{
  position:absolute;inset:0;z-index:-4;opacity:.24;pointer-events:none;
  background:
    repeating-radial-gradient(circle at 23% 41%, rgba(238,230,215,.06) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(13deg, transparent 0 18px, rgba(238,230,215,.018) 19px 20px);
  mix-blend-mode:soft-light;
}
.doorframe{
  position:absolute; inset:0; z-index:-3; pointer-events:none;
}
.doorframe:before,.doorframe:after{
  content:""; position:absolute; top:0; bottom:0; width:22px;
  background:
    linear-gradient(90deg,rgba(0,0,0,.7),rgba(70,53,40,.3),rgba(0,0,0,.55)),
    repeating-linear-gradient(0deg,transparent 0 26px,rgba(205,177,132,.035) 27px 28px);
  box-shadow:0 0 28px rgba(0,0,0,.55);
}
.doorframe:before{left:0}
.doorframe:after{right:0;transform:scaleX(-1)}
.red-thread{
  position:absolute; left:8%; right:8%; bottom:116px; height:1px; z-index:-2;
  background:linear-gradient(90deg,transparent,rgba(103,24,24,.18) 18%,rgba(126,28,28,.3) 50%,rgba(103,24,24,.18) 82%,transparent);
  transform:rotate(-1.8deg);
  box-shadow:0 0 9px rgba(126,28,28,.12);
}
.threshold{
  position:absolute;
  left:-8%; right:-8%; bottom:48px; height:68px; z-index:-2;
  transform:perspective(500px) rotateX(66deg);
  transform-origin:center bottom;
  background:
    linear-gradient(180deg,rgba(89,66,45,.42),rgba(28,22,18,.9)),
    repeating-linear-gradient(90deg,rgba(224,201,165,.035) 0 3px,transparent 3px 70px);
  border-top:1px solid rgba(180,146,97,.22);
  box-shadow:0 -12px 35px rgba(0,0,0,.5), inset 0 1px rgba(238,230,215,.04);
  animation:thresholdBreath 5s ease-in-out infinite;
}
@keyframes thresholdBreath{
  0%,100%{filter:brightness(.86)}
  50%{filter:brightness(1.03)}
}
.home-inner{
  width:100%;
  max-width:560px;
  margin:auto;
  padding:26px 4px 118px;
  animation:homeFade .7s ease both;
}
@keyframes homeFade{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.home-v4 .eyebrow{
  color:#a98d5e;
  letter-spacing:.19em;
  font-size:11px;
}
.home-title{
  margin:16px 0 12px;
  font-size:clamp(40px,11vw,64px);
  line-height:1.04;
  letter-spacing:-.055em;
  text-shadow:0 8px 28px rgba(0,0,0,.32);
}
.home-sub{
  margin:0 auto;
  color:#cbbfaf;
  line-height:1.78;
  font-size:15px;
}
.home-meta{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:22px 0 0;
}
.home-meta span{
  padding:7px 10px;
  border:1px solid rgba(238,230,215,.10);
  border-radius:999px;
  color:#91887c;
  background:rgba(238,230,215,.025);
  font-size:11px;
}
.warning-card{
  position:relative;
  margin:30px auto 22px;
  padding:18px 18px 17px;
  width:min(100%,470px);
  border-top:1px solid rgba(155,128,81,.23);
  border-bottom:1px solid rgba(155,128,81,.15);
  color:#d6c9b5;
  font-size:14px;
  line-height:1.7;
}
.warning-card:before{
  content:"禁";
  position:absolute;
  left:50%;
  top:-13px;
  transform:translateX(-50%);
  width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;
  color:#8d734b;
  background:#171411;
  border:1px solid rgba(155,128,81,.35);
  font-size:11px;
}
.threshold-btn{
  width:min(100%,430px);
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,#eee6d7,#dfd2bf);
  color:#171411;
  border:1px solid rgba(174,144,96,.55);
  padding:17px 24px;
  border-radius:13px;
  font-size:17px;
  font-weight:900;
  letter-spacing:-.02em;
  box-shadow:
    0 12px 36px rgba(0,0,0,.32),
    0 0 0 1px rgba(255,255,255,.03) inset;
  animation:ctaGlow 3.5s ease-in-out infinite;
}
.threshold-btn:before{
  content:"";
  position:absolute; inset:-1px auto -1px -38%;
  width:28%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.36),transparent);
  transform:skewX(-18deg);
  animation:ctaSweep 4.2s ease-in-out infinite;
}
@keyframes ctaGlow{
  0%,100%{box-shadow:0 12px 36px rgba(0,0,0,.32),0 0 0 rgba(155,128,81,0)}
  50%{box-shadow:0 12px 36px rgba(0,0,0,.32),0 0 24px rgba(155,128,81,.10)}
}
@keyframes ctaSweep{
  0%,72%{left:-38%;opacity:0}
  78%{opacity:1}
  100%{left:120%;opacity:0}
}
.threshold-btn:active{transform:translateY(1px)}
.home-foot{
  margin-top:14px;
  color:#655f57;
  font-size:11px;
}
.entering .home-inner{
  animation:crossThreshold .42s ease-in forwards;
}
.entering .threshold{
  animation:thresholdPass .42s ease-in forwards;
}
@keyframes crossThreshold{
  to{opacity:0;transform:translateY(18px) scale(1.035);filter:blur(1.5px)}
}
@keyframes thresholdPass{
  to{transform:perspective(500px) rotateX(66deg) translateY(22px) scale(1.08);filter:brightness(1.16)}
}
@media(max-height:690px){
  .home-inner{padding-top:8px;padding-bottom:92px}
  .home-title{font-size:38px}
  .warning-card{margin:20px auto 16px;padding:14px 12px}
  .threshold{bottom:30px}
}

.barRow .bar > i::after{content:"";position:absolute;z-index:2;right:-7px;top:50%;width:13px;height:13px;transform:translateY(-50%) rotate(45deg);border-radius:3px;background:radial-gradient(circle at 35% 35%, #f3dfaa 0 13%, #c19853 45%, #76552a 100%);border:1px solid rgba(245,220,163,.78);box-shadow:0 0 0 2px rgba(18,14,11,.9),0 0 9px rgba(198,151,74,.38)}

.barRow .bar > i::before{inset:3px 8px;opacity:.38;background:repeating-linear-gradient(108deg,rgba(234,204,137,.22) 0 1px,transparent 1px 12px)}

<script>window.TEST_DATA = {"questions":[{"q":"새벽 2시. 현관문 밖에서 누군가 당신의 이름을 세 번 부른다.","sub":"세 번째 부름이 끝난 뒤, 문밖은 다시 조용해졌다. 초인종은 한 번도 울리지 않았다.\n이때 가장 먼저 취할 행동은?","answers":[{"text":"대답하지 않고, 부르는 간격과 목소리의 특징부터 확인한다.","axes":{"Q":2,"D":1},"primary":"행","secondary":"도경"},{"text":"현관을 피해서 빠져나갈 다른 동선부터 확보한다.","axes":{"P":2,"F":1},"primary":"자별","secondary":"중기"},{"text":"같이 있는 사람들을 안쪽 방으로 보내고 내가 현관 쪽에 남는다.","axes":{"G":2,"A":1},"primary":"금황","secondary":"은황"},{"text":"문은 열지 않되 “누구세요?”라고 바로 묻는다.","axes":{"E":2,"A":1},"primary":"아유","secondary":"범준"}]},{"q":"함께 있던 사람이 “절대로 밟지 말라”던 금줄을 실수로 넘어갔다.","sub":"아직 아무 일도 일어나지는 않았다.\n이때 가장 먼저 취할 행동은?","answers":[{"text":"먼저 그 사람을 금줄을 넘기 전 자리로 되돌린다. 원인은 나중이다.","axes":{"G":2,"A":1},"primary":"은황","secondary":"금황"},{"text":"금줄이 왜 쳐져 있었는지부터 주변 흔적을 확인한다.","axes":{"Q":2,"D":1},"primary":"행","secondary":"도경"},{"text":"이미 어긴 이상 원래 계획을 버리고 즉시 다른 장소로 이동한다.","axes":{"F":2,"P":1},"primary":"삼랑","secondary":"자별"},{"text":"“내가 밟지 말랬잖아!”라고 한마디 한 뒤 바로 수습한다.","axes":{"E":2,"G":1},"primary":"범준","secondary":"아유"}]},{"q":"오래된 빈집에서 정체불명의 작은 물건을 발견했다.","sub":"왠지 중요한 물건인 것 같다.\n이때 가장 먼저 취할 행동은?","answers":[{"text":"손대지 않고 사진·위치·형태부터 기록한다.","axes":{"Q":2,"P":1},"primary":"도경","secondary":"행"},{"text":"필요할 수도 있으니 일단 챙긴다.","axes":{"A":2,"F":1},"primary":"삼랑","secondary":"아유"},{"text":"위험 여부가 확인될 때까지 그대로 둔다.","axes":{"P":2,"D":1},"primary":"중기","secondary":"금황"},{"text":"같이 온 사람에게 보여주며 “너라면 이거 만질래?”라고 묻는다.","axes":{"E":2,"Q":1},"primary":"아유","secondary":"행"}]},{"q":"가장 경험 많은 사람이 이유도 설명하지 않은 채 “오늘 밤은 절대로 밖에 나가지 마”라고 한다.","sub":"하지만 당신에게는 원래 오늘 밤 밖에서 확인하려던 일이 하나 남아 있다.\n이때 가장 먼저 취할 행동은?","answers":[{"text":"일단 따른다. 그 사람이 저렇게 말하는 데는 이유가 있을 것이다.","axes":{"G":2,"P":1},"primary":"금황","secondary":"은황"},{"text":"따르긴 하는데, 이유를 알아낼 때까지 계속 캐묻는다.","axes":{"Q":2,"E":1},"primary":"행","secondary":"아유"},{"text":"주변 상황을 확인해서 그 지시가 여전히 유효한지 직접 판단한다.","axes":{"P":2,"F":1},"primary":"자별","secondary":"삼랑"},{"text":"위험해도 꼭 나가야 할 이유가 있다면 나간다.","axes":{"A":2,"D":1},"primary":"범준","secondary":"은황"}]},{"q":"계획해둔 탈출로가 눈앞에서 막혔다.","sub":"뒤에서는 무언가가 가까워지고 있다.\n이때 가장 먼저 취할 행동은?","answers":[{"text":"가까운 옆길로 바로 방향을 튼다. 완벽한 경로는 이동하면서 찾는다.","axes":{"F":2,"A":1},"primary":"삼랑","secondary":"자별"},{"text":"잠시 멈춰 주변 지형과 출구를 확인한 뒤, 새 탈출 경로를 정한다.","axes":{"P":2,"F":1},"primary":"자별","secondary":"중기"},{"text":"막힌 곳을 뚫을 방법부터 찾는다.","axes":{"A":2,"D":1},"primary":"범준","secondary":"금황"},{"text":"새 길을 찾되, 일행 모두가 따라올 수 있는 경로부터 본다.","axes":{"G":2,"P":1},"primary":"중기","secondary":"은황"}]},{"q":"어떤 의식을 여섯 번 시도했는데 여섯 번 모두 실패했다.","sub":"이때 가장 먼저 취할 행동은?","answers":[{"text":"실패 원인을 하나씩 좁혀가며 곧바로 일곱 번째 시도를 준비한다.","axes":{"D":2,"Q":1},"primary":"도경","secondary":"범준"},{"text":"같은 방법을 계속하는 건 의미 없다. 접근법을 완전히 바꾼다.","axes":{"F":2,"P":1},"primary":"자별","secondary":"삼랑"},{"text":"지금까지의 과정과 도구를 처음부터 목록화해, 빠뜨린 절차가 없는지 전부 다시 점검한다.","axes":{"D":2,"F":1},"primary":"신기","secondary":"도경"},{"text":"다른 사람에게 과정을 설명해본다. 말하다 보면 틀린 부분이 보일 수도 있다.","axes":{"E":2,"Q":1},"primary":"아유","secondary":"행"}]},{"q":"생존자들 사이에서 의견이 완전히 둘로 갈렸다.","sub":"한쪽은 지금 이동하자고 하고, 다른 쪽은 날이 밝을 때까지 기다리자고 한다.\n이때 가장 먼저 취할 행동은?","answers":[{"text":"양쪽 말을 들은 뒤 가장 현실적인 제3안을 만든다.","axes":{"P":2,"F":1},"primary":"자별","secondary":"삼랑"},{"text":"약한 사람들이 피해를 덜 보는 쪽을 선택한다.","axes":{"G":2,"P":1},"primary":"은황","secondary":"중기"},{"text":"내 생각이 틀렸더라도 좋으니 다들 근거부터 말해보라고 한다.","axes":{"E":2,"Q":1},"primary":"아유","secondary":"행"},{"text":"결론이 안 나면 내가 먼저 행동한다. 따라올 사람만 따라오면 된다.","axes":{"A":2,"D":1},"primary":"범준","secondary":"금황"}]},{"q":"매일 밤 같은 시간, 창문에 처음 보는 손자국이 하나씩 늘어난다.","sub":"지워도 다음 날이면 다시 생긴다. 아직 직접적인 피해는 없다.\n이때 가장 먼저 취할 행동은?","answers":[{"text":"날짜·시간·위치를 전부 기록한다. 너무 궁금하다.","axes":{"Q":2,"D":1},"primary":"행","secondary":"도경"},{"text":"손자국이 생기는 장소를 일부러 바꿔본다. 반응을 보고 싶다.","axes":{"Q":2,"A":1},"primary":"도경","secondary":"행"},{"text":"위험해지기 전에 창문을 막고 다른 방에서 잔다.","axes":{"P":2,"G":1},"primary":"중기","secondary":"금황"},{"text":"오늘 밤은 안 자고 직접 지켜본다.","axes":{"D":2,"A":1},"primary":"금황","secondary":"도경"}]},{"q":"밤길을 반드시 지나야 한다. 그런데 동행 한 명이 겁에 질려 움직이지 못한다.","sub":"이때 가장 먼저 취할 행동은?","answers":[{"text":"그 사람을 데리고 갈 수 있는 속도와 경로로 계획을 바꾼다.","axes":{"G":2,"F":1},"primary":"은황","secondary":"삼랑"},{"text":"내가 앞장서고 따라오라고 한다.","axes":{"A":2,"G":1},"primary":"금황","secondary":"범준"},{"text":"잠깐 쉬면서 위험 요소와 이동 방법을 설명해 안심시킨다.","axes":{"E":2,"P":1},"primary":"신기","secondary":"은황"},{"text":"지금 움직이는 것과 기다리는 것 중 어느 쪽 위험이 큰지 계산한다.","axes":{"P":2,"Q":1},"primary":"자별","secondary":"행"}]},{"q":"집 문턱 밖에서 낯선 사람이 “한밤만 재워달라”고 한다.","sub":"이때 가장 먼저 취할 행동은?","answers":[{"text":"일단 들이지 않는다. 대신 밖에서 도울 방법을 찾는다.","axes":{"G":2,"P":1},"primary":"중기","secondary":"은황"},{"text":"어디서 왔고 왜 혼자인지 질문부터 한다.","axes":{"Q":2,"E":1},"primary":"아유","secondary":"행"},{"text":"이상한 점이 없으면 들인다. 위험은 그때 대응한다.","axes":{"A":2,"F":1},"primary":"삼랑","secondary":"범준"},{"text":"그 사람보다 주변을 먼저 본다. 누군가 따라온 흔적이 있는지 확인한다.","axes":{"P":2,"Q":1},"primary":"금황","secondary":"자별"}]},{"q":"산길에서 “뒤에서 무슨 소리가 나도 절대로 돌아보지 마”라는 경고를 들었다.","sub":"얼마 뒤, 뒤에서 가족의 목소리가 들린다.\n이때 가장 먼저 취할 행동은?","answers":[{"text":"무슨 일이 있어도 계속 걷는다.","axes":{"D":2,"P":1},"primary":"도경","secondary":"금황"},{"text":"돌아보진 않지만 그 목소리가 진짜인지 확인할 다른 방법을 찾는다.","axes":{"Q":2,"F":1},"primary":"행","secondary":"자별"},{"text":"정말 가족일 가능성을 외면할 수 없다. 돌아본다.","axes":{"G":2,"A":1},"primary":"은황","secondary":"범준"},{"text":"“거기 누구야?”라고 소리치면서 계속 걷는다.","axes":{"E":2,"A":1},"primary":"아유","secondary":"범준"}]},{"q":"사용법을 모르는 물건 하나가 있다.","sub":"제대로 쓰면 위기를 벗어날 수도 있지만 잘못 쓰면 위험하다.\n이때 가장 먼저 취할 행동은?","answers":[{"text":"구조와 흔적을 살펴 작동 원리를 추측한다.","axes":{"Q":2,"D":1},"primary":"행","secondary":"도경"},{"text":"위험을 감수하고 최소한으로 시험해본다.","axes":{"A":2,"Q":1},"primary":"삼랑","secondary":"행"},{"text":"지금 쓰지 않는다. 더 안전한 해결법부터 찾는다.","axes":{"P":2,"G":1},"primary":"중기","secondary":"금황"},{"text":"원래 목적과 다르더라도 지금 상황에 맞게 응용해본다.","axes":{"F":2,"P":1},"primary":"자별","secondary":"삼랑"}]},{"q":"한 달 동안 조사했지만 원하는 답을 하나도 찾지 못했다.","sub":"확인할 수 있는 자료는 거의 다 확인했고, 남은 것은 몇 개뿐이다.\n이때 가장 먼저 취할 행동은?","answers":[{"text":"아직 확인하지 않은 자료가 있으면 계속한다.","axes":{"D":2,"Q":1},"primary":"도경","secondary":"신기"},{"text":"질문 자체가 잘못됐을 수도 있다. 처음부터 다시 정의한다.","axes":{"F":2,"P":1},"primary":"자별","secondary":"행"},{"text":"지금까지 모은 정보만으로 새로운 가설을 만든다.","axes":{"Q":2,"P":1},"primary":"행","secondary":"자별"},{"text":"다른 사람에게 내 결론을 보여주고 반박해달라고 한다.","axes":{"E":2,"F":1},"primary":"아유","secondary":"삼랑"}]},{"q":"당신과 일행은 결국 무사히 빠져나왔다. 이제 단 한 가지 일만 할 수 있다면?","sub":"","answers":[{"text":"왜 이런 일이 벌어졌는지 끝까지 알아낸다.","axes":{"Q":2,"D":1},"primary":"행","secondary":"도경"},{"text":"다시는 같은 일이 생기지 않도록 대비책을 만든다.","axes":{"P":2,"G":1},"primary":"중기","secondary":"자별"},{"text":"함께 살아남은 사람들이 무사한지 확인한다.","axes":{"G":2,"A":1},"primary":"은황","secondary":"금황"},{"text":"있었던 일을 다른 사람들에게 전한다.","axes":{"E":2,"F":1},"primary":"삼랑","secondary":"아유"}]}],"profiles":{"자별":{"title":"판을 다시 짜는 생존자","quote":"정해진 선택지가 마음에 안 들면, 선택지를 새로 만든다.","desc":"문제가 생기면 선택지보다 구조부터 봅니다. 계획은 세우되 계획 자체에 충성하지 않고, 목적을 위해 판을 다시 짜는 쪽입니다.","strength":["복잡한 상황의 구조를 빠르게 읽음","계획이 틀어져도 목적을 놓치지 않음","상대의 움직임까지 자원으로 활용"],"risk":["모든 문제를 통제하려 들 수 있음","머릿속 계산을 주변도 알고 있다고 착각할 수 있음"],"image":"assets/characters/jabyeol.webp","titleLines":["판을 다시 짜는","생존자"],"descParas":["당신은 상황을 있는 그대로 받아들이기보다, 그 안에 숨어 있는 구조를 먼저 읽으려는 사람입니다. 문제가 생겼을 때도 “이제 어떡하지?”보다 “왜 이렇게 됐지?”, “지금 누가 무엇을 원하고 있지?”, “내가 바꿀 수 있는 부분은 어디지?”라는 질문이 먼저 떠오르는 편입니다. 그래서 남들이 이미 주어진 선택지 안에서 고민하고 있을 때, 당신은 아예 새로운 선택지를 만들어내기도 합니다. 계획을 세우는 능력도 강하지만, 계획 그 자체를 고집하지는 않습니다. 목적을 이루기 위해서라면 기존 방식을 버리고 다른 길을 선택할 수 있고, 예상치 못한 변수가 생기면 오히려 그 변수를 이용하려는 쪽에 가깝습니다.","겉으로는 침착하고 자신감 있어 보이지만, 실제로는 머릿속에서 꽤 많은 경우의 수를 동시에 계산하고 있을 가능성이 높습니다. 누군가에게 쉽게 휘둘리는 것을 싫어하고, 자신이 상황을 이해하고 있다는 감각이 있어야 마음이 편해집니다. 그래서 통제할 수 없는 상황이나 이유를 알 수 없는 감정적 갈등에서는 평소보다 더 예민해질 수 있습니다. 반대로 정보를 충분히 확보하면 긴장하던 상황에서도 빠르게 주도권을 되찾습니다.","사람을 대할 때도 마찬가지입니다. 말보다 상대의 행동과 의도를 보는 편이고, 누가 자신에게 솔직하지 않다고 느끼면 그 이유부터 추측합니다. 누군가를 돕더라도 무조건적인 희생보다는 “이 사람을 어떻게 움직여야 상황 전체가 나아질까”를 생각하는 현실적인 면이 있습니다. 그래서 때로는 계산적이라는 인상을 줄 수 있지만, 실제로는 책임져야 할 사람을 쉽게 버리지 못하는 편입니다.","당신의 가장 큰 장점은 불리한 상황에서도 새로운 판을 만들 수 있다는 것입니다. 다만 모든 문제를 해결 가능한 퍼즐로 보는 습관 때문에, 굳이 해결하지 않아도 되는 일까지 자신이 책임지려 하거나 다른 사람의 선택까지 조정하려 들 수 있습니다. 가끔은 모든 상황을 이해하고 통제하지 않아도 괜찮다는 사실을 받아들이는 것이 당신에게 가장 어려운 과제가 될지도 모릅니다."],"worldCta":"자별이 판을 다시 짜는 세계 보기"},"행":{"title":"끝없이 파고드는 탐구자","quote":"무섭긴 한데… 그래서 저건 왜 저러는 거지?","desc":"미지의 것을 만나면 두려움과 동시에 호기심이 켜집니다. 당장 쓸모가 없어도 이해되지 않는 것은 그냥 지나가기 어렵습니다.","strength":["이상징후에서 질문을 찾아냄","실패를 정보로 바꾸는 편","새로운 가설로 빠르게 이동"],"risk":["호기심이 안전보다 앞설 수 있음","현실적 중요성보다 흥미에 끌릴 수 있음"],"image":"assets/characters/haeng.webp","titleLines":["끝없이 파고드는","탐구자"],"descParas":["당신은 미지의 것을 만나면 두려움보다 먼저 궁금증이 켜지는 사람입니다. 이해할 수 없는 일이 벌어졌을 때 다른 사람들은 “피해야겠다”고 생각하지만, 당신은 동시에 “그런데 왜 이런 일이 생긴 거지?”라는 질문을 떠올립니다. 당장 쓸모가 없더라도 흥미로운 주제라면 오래 들여다볼 수 있고, 하나의 답을 발견하면 거기에서 새로운 질문을 찾아내는 편입니다. 당신에게 지식은 단순히 문제를 해결하기 위한 도구라기보다 그 자체로 즐거움에 가깝습니다.","특히 다른 사람들이 별로 관심을 갖지 않는 분야에 이상하게 끌릴 가능성이 높습니다. 남들이 중요하다고 말하는 것보다 스스로 “이건 이상하다”, “이건 좀 더 알아보고 싶다”고 느끼는 것이 훨씬 강한 동기가 됩니다. 그래서 관심 있는 일에는 시간 가는 줄 모르고 몰입하지만, 흥미가 없는 일에는 놀랄 만큼 에너지가 나오지 않을 수도 있습니다. 생활 전체는 느슨해 보여도 특정 분야에서는 누구보다 오래 집중하는 식입니다.","실패를 받아들이는 방식도 독특합니다. 원하는 결과가 나오지 않았다고 해서 바로 실패라고 판단하기보다는 “적어도 이 방법은 아니라는 걸 알았다”고 생각하는 편입니다. 그래서 새로운 시도를 두려워하지 않고, 기존 설명이 맞지 않으면 가설 자체를 바꾸는 데도 비교적 거리낌이 없습니다. 당신에게 틀렸다는 사실은 자존심의 문제가 아니라 새로운 정보에 가깝습니다.","사람과의 관계에서도 호기심이 작동합니다. 상대가 왜 그런 생각을 하는지, 어떤 경험 때문에 그런 행동을 하는지 알고 싶어 합니다. 다만 감정보다 흥미가 먼저 움직일 때는 상대가 심각하게 받아들이는 일을 지나치게 관찰자의 시선으로 볼 수도 있습니다. 당신의 가장 큰 강점은 모두가 지나치는 곳에서 질문을 발견하는 능력입니다. 하지만 때로는 세상 모든 이상한 것을 직접 확인할 필요는 없습니다. 오컬트 세계라면 특히 그렇습니다."],"worldCta":"행이 연구하는 세계 보기"},"도경":{"title":"497번을 버티는 몰입자","quote":"안 됐다고? 그럼 한 번 더.","desc":"화려하게 시작하기보다 끝까지 남는 사람입니다. 관심 분야가 생기면 실패를 조금씩 수정하며 결과가 나올 때까지 밀어붙입니다.","strength":["반복과 실패를 오래 견딤","좁은 분야를 깊게 파고듦","꼼꼼하고 결과 중심"],"risk":["방향을 바꿔야 할 때도 오래 붙들 수 있음","열정이 밖으로 잘 드러나지 않을 수 있음"],"image":"assets/characters/dokyung.webp","titleLines":["497번을 버티는","몰입자"],"descParas":["당신은 한 번 중요하다고 판단한 일을 쉽게 포기하지 않는 사람입니다. 처음부터 무엇이든 잘하는 천재형이라기보다, 남들이 지쳐서 떠난 뒤에도 혼자 남아 계속 시도하는 쪽에 가깝습니다. 원하는 결과가 나오지 않으면 자신의 능력을 의심하기보다 과정에서 무엇이 잘못됐는지 하나씩 확인하고, 조금씩 수정해서 다시 시도합니다. 세 번, 열 번, 백 번 실패해도 아직 확인하지 않은 가능성이 있다고 생각하면 계속할 수 있는 사람입니다.","당신의 관심사는 넓기보다 깊을 가능성이 큽니다. 주변 사람들이 왜 그런 것에 그렇게까지 관심을 갖는지 이해하지 못해도 크게 신경 쓰지 않습니다. 자신에게 의미가 있다면 그것으로 충분하기 때문입니다. 한 분야에 오래 머무르면서 남들이 눈치채지 못한 차이를 발견하고, 결국 자신만의 전문성을 만드는 유형입니다. 이런 사람은 처음에는 조용해서 눈에 잘 띄지 않지만 시간이 지날수록 “저 사람은 저 분야에서 정말 많이 알고 있다”는 평가를 받게 됩니다.","당신은 결과로 말하는 것을 선호합니다. 자신이 얼마나 노력했는지, 얼마나 힘들었는지를 길게 설명하기보다 완성된 것을 내놓는 편입니다. 칭찬을 받아도 크게 반응하지 않을 수 있고, 다른 사람들에게 인정받는 것보다 스스로 납득할 수 있는 결과를 얻는 것이 더 중요합니다. 그래서 주변에서는 당신이 무엇에 기뻐하고 무엇 때문에 힘들어하는지 제대로 알기 어려울 때도 있습니다.","당신의 강점은 집중력과 지속성입니다. 다만 그만큼 위험한 점도 분명합니다. 오래 버틸 수 있다는 능력 때문에, 이미 방향을 바꿔야 하는 상황에서도 “조금만 더 하면 된다”고 생각하며 계속 붙잡고 있을 수 있습니다. 당신에게 필요한 것은 포기하는 법이 아니라, 어떤 순간에 포기하는 것이 오히려 더 좋은 선택인지 판단하는 기준일지도 모릅니다."],"worldCta":"도경이 버텨낸 세계 보기"},"은황":{"title":"두려워도 곁을 지키는 수호자","quote":"무서워. 그래도 저 사람을 두고 갈 수는 없어.","desc":"위험을 느끼고 걱정도 많이 하지만, 결정적인 순간에는 사람을 먼저 봅니다. 확신보다 책임감이 행동을 만드는 유형입니다.","strength":["사람을 버리지 않는 책임감","두려움 속에서도 필요한 행동을 함","관계에서 높은 신뢰를 줌"],"risk":["필요 이상의 책임까지 떠안을 수 있음","잘못이 없어도 죄책감을 크게 느낄 수 있음"],"image":"assets/characters/eunhwang.webp","titleLines":["두려워도 곁을 지키는","수호자"],"descParas":["당신은 위험을 느끼지 못하는 사람이 아니라, 위험을 알면서도 결국 해야 할 일을 외면하지 못하는 사람입니다. 무서운 상황에서는 실제로 무섭고, 일이 잘못될 가능성도 많이 생각합니다. 하지만 자신이 빠지면 누군가가 더 힘들어질 것 같다는 생각이 들면 결국 다시 돌아옵니다. 당신의 용기는 자신감에서 나오기보다 책임감에서 나오는 경우가 많습니다.","사람들의 감정이나 상태를 비교적 잘 알아차리는 편이고, 주변에서 누군가 불편해하거나 상처받는 상황을 그냥 지나가기 어려워합니다. 그래서 자신이 직접 원인을 만든 일이 아니더라도 “내가 조금 더 잘했으면 달라지지 않았을까”라고 생각할 수 있습니다. 책임감이 강한 만큼 죄책감도 쉽게 자신의 몫으로 가져오는 편입니다. 다른 사람이 보기에는 이미 충분히 잘하고 있는데도 혼자 자신을 부족하다고 평가할 가능성이 있습니다.","갈등 상황에서는 처음부터 크게 화내기보다 오래 참는 편입니다. 가능하면 모두가 무사하게 넘어가는 방법을 찾으려고 하고, 자신의 감정보다는 다른 사람의 상황을 먼저 생각합니다. 하지만 누군가를 지켜야 한다고 판단하는 순간에는 평소와 달리 상당히 단호해질 수 있습니다. 자신을 위한 일에는 망설이면서도 다른 사람을 위한 일에서는 예상보다 강해지는 유형입니다.","당신의 가장 큰 장점은 다른 사람이 안심하고 등을 맡길 수 있는 사람이라는 것입니다. 다만 언제나 누군가를 책임져야 한다고 생각하면 결국 자신이 먼저 지치게 됩니다. 당신이 모든 사람의 문제를 해결해야 하는 것은 아닙니다. 때로는 자신을 지키는 것도 다른 사람을 지키는 일만큼 중요한 책임입니다."],"worldCta":"은황이 지키려 했던 세계 보기"},"금황":{"title":"말없이 먼저 막아서는 실용가","quote":"괜찮냐고 묻기 전에 위험한 쪽으로 먼저 간다.","desc":"감정을 설명하기보다 필요한 행동을 먼저 합니다. 위험이 나타나면 말보다 몸이 앞서고, 가까운 사람을 지키는 일에는 타협이 적습니다.","strength":["위기에서 빠르고 실용적인 판단","행동으로 신뢰를 줌","보호해야 할 대상 앞에서 강함"],"risk":["생각을 말하지 않아 오해받을 수 있음","한번 정한 방법을 쉽게 바꾸지 않을 수 있음"],"image":"assets/characters/geumhwang.webp","titleLines":["말없이 먼저 막아서는","실용가"],"descParas":["당신은 감정을 길게 말하기보다 행동으로 보여주는 사람입니다. 걱정되는 사람이 있다고 해서 계속 “괜찮아?”라고 묻기보다는 필요한 것을 준비하거나 위험한 상황에서 자연스럽게 앞에 서는 편입니다. 그래서 가까운 사람들은 당신이 무심해 보일 때도 있지만, 결정적인 순간에는 누구보다 믿을 만하다고 느낄 가능성이 높습니다.","문제가 생기면 감정적으로 반응하기보다 현실적으로 무엇을 해야 하는지부터 판단합니다. 필요한 정보가 충분하다고 생각하면 오래 고민하지 않고 움직이며, 불필요한 설명이나 회의를 답답하게 느낄 수도 있습니다. 말보다 결과가 중요하다고 생각하기 때문에 자신의 생각을 충분히 설명하지 않고 행동부터 시작하는 경우도 있습니다. 이 때문에 주변 사람들이 당신의 의도를 뒤늦게 이해하는 일도 생깁니다.","사람을 쉽게 믿는 편은 아닐 가능성이 높습니다. 하지만 한 번 자신의 사람이라고 판단한 대상에게는 상당히 강한 책임감을 느낍니다. 애정 표현이 크지 않더라도 상대가 위험하면 자신이 손해를 보더라도 먼저 움직입니다. 당신에게 관계는 말로 확인하는 것보다 행동의 누적으로 만들어지는 것입니다.","당신의 장점은 위기에서 흔들리지 않는 현실감각과 행동력입니다. 다만 한번 옳다고 판단한 방법을 쉽게 바꾸지 않는 경향이 있어, 상황이 크게 변했을 때 새로운 방식으로 전환하는 데 시간이 걸릴 수 있습니다. 또한 자신의 감정을 너무 오래 안에서 처리하면 주변에서는 당신이 괜찮다고 착각할 수 있습니다. 가끔은 말로 설명하는 것도 행동만큼 중요한 정보가 됩니다."],"worldCta":"금황이 살아가는 세계 보기"},"범준":{"title":"정면으로 버티는 의리파","quote":"막혔으면 뚫으면 되지.","desc":"복잡하게 돌아가기보다 확실한 행동을 선호합니다. 한번 옳다고 생각하면 쉽게 포기하지 않고, 약자를 희생시키는 해결법을 싫어합니다.","strength":["강한 돌파력과 배짱","의리와 보호 본능","압박 속에서도 쉽게 물러나지 않음"],"risk":["자존심 때문에 싸움을 오래 끌 수 있음","방향 전환을 패배처럼 느낄 수 있음"],"image":"assets/characters/beomjun.webp","titleLines":["정면으로 버티는","의리파"],"descParas":["당신은 복잡하게 돌아가는 것보다 분명한 선택을 좋아하는 사람입니다. 해야 한다고 생각하면 움직이고, 잘못됐다고 느끼면 직접 말합니다. 위험한 상황에서도 오래 계산하기보다 “지금 무엇을 해야 하는가”를 결정하고 행동하는 편이라 주변 사람들에게 강한 사람으로 보이기 쉽습니다.","특히 의리와 공정함에 민감합니다. 힘 있는 사람이 약한 사람을 함부로 대하거나, 누군가가 책임을 피하려는 모습을 보면 그냥 넘어가기 어려울 수 있습니다. 자신에게 직접 관계없는 일이라도 “저건 아니지”라는 생각이 들면 개입할 가능성이 있습니다. 당신에게 옳고 그름은 단순한 의견이 아니라 행동해야 하는 기준에 가깝습니다.","자존심도 상당히 강한 편입니다. 자신의 판단을 쉽게 포기하지 않고, 한번 결정한 일은 끝까지 밀어붙이는 힘이 있습니다. 이 성향 덕분에 남들이 포기할 상황에서도 버틸 수 있지만, 반대로 자신의 판단이 틀렸다는 사실을 인정하는 데 시간이 걸릴 수 있습니다. 실제 문제보다 “내가 틀렸다는 걸 인정하기 싫다”는 감정이 더 크게 작동하는 순간도 생길 수 있습니다.","당신은 생각과 감정을 비교적 숨기지 않는 편입니다. 기분이 좋으면 좋다고 하고, 화가 나면 얼굴과 말투에서 티가 납니다. 그래서 사람들은 당신을 이해하기는 쉽지만, 때로는 지나치게 직선적이라고 느낄 수도 있습니다. 당신의 가장 큰 강점은 겁먹은 사람들 사이에서 먼저 앞으로 나갈 수 있다는 것입니다. 다만 모든 벽이 부숴야 하는 벽은 아닙니다. 때로는 돌아가는 길이 패배가 아니라 더 좋은 전략일 수 있습니다."],"worldCta":"범준이 버티는 세계 보기"},"아유":{"title":"의문을 바로 쏘는 직설 탐색자","quote":"근데 그 말, 앞뒤가 안 맞는데?","desc":"다른 사람들이 속으로만 생각하는 질문을 밖으로 꺼냅니다. 설명이 이상하면 바로 묻고, 상황이 바뀌면 판단도 빠르게 바꿉니다.","strength":["논리의 빈틈을 빠르게 발견","즉각적인 질문과 피드백","새 상황에 대한 높은 적응력"],"risk":["직설이 공격처럼 들릴 수 있음","궁금해서 굳이 안 건드려도 될 것을 건드릴 수 있음"],"image":"assets/characters/ayu.webp","titleLines":["의문을 바로 쏘는","직설 탐색자"],"descParas":["당신은 설명이 이상하면 그냥 넘어가지 못하는 사람입니다. 다른 사람들이 “그럴 수도 있지” 하고 지나가는 부분에서도 “잠깐, 그런데 앞에서 말한 거랑 안 맞지 않아?”라는 질문이 떠오릅니다. 그리고 대부분의 경우 그 질문을 머릿속에만 두지 않습니다. 궁금한 것을 바로 확인해야 마음이 편하기 때문입니다.","새로운 환경이나 사람을 만났을 때도 관찰이 빠른 편입니다. 작은 말투 변화나 행동의 이상한 점을 눈치채고, 상황이 바뀌면 자신의 판단도 비교적 빠르게 수정합니다. 처음 생각이 틀렸다는 것을 알게 되면 오래 붙잡기보다 “그럼 이쪽이네” 하고 방향을 바꾸는 편입니다. 그래서 예측하기 어려운 상황에서도 의외로 생존력이 높은 유형입니다.","감정과 생각이 밖으로 잘 드러나는 편이라 주변 사람들이 당신이 무엇을 좋아하고 싫어하는지 쉽게 알 수 있습니다. 친한 사람에게는 장난도 많고 말도 많은 편일 수 있지만, 이해되지 않는 상황에서는 상당히 직설적으로 변할 수 있습니다. 당신에게는 단순한 질문이 상대에게는 공격처럼 들리는 경우도 있을 수 있습니다.","당신의 가장 큰 무기는 이상한 것을 이상하다고 말할 수 있는 능력입니다. 모두가 분위기에 휩쓸릴 때 혼자 논리적인 구멍을 발견할 가능성이 높습니다. 다만 호기심과 즉흥성이 동시에 작동하면 굳이 확인하지 않아도 되는 것까지 건드릴 수 있습니다. 공포영화 속에서 “저 문은 왜 잠겨 있지?”라고 말한 뒤 직접 열어보는 사람이 있다면, 당신일 가능성이 조금 높습니다."],"worldCta":"아유가 날아다니는 세계 보기"},"신기":{"title":"결국 끝까지 해내는 실무자","quote":"그래서 결국 이거 누가 해야 하는데?","desc":"계획을 현실로 바꾸는 단계에서 강합니다. 귀찮다고 말하면서도 맡은 일을 방치하지 않고 가능한 방법을 찾아 마무리합니다.","strength":["높은 완수력","현실적인 문제 처리","꾸준하고 신뢰 가능한 실무"],"risk":["일이 계속 자신에게 몰릴 수 있음","정작 중요한 순간에 이미 지쳐 있을 수 있음"],"image":"assets/characters/shingi.webp","titleLines":["결국 끝까지 해내는","실무자"],"descParas":["당신은 아이디어를 내는 사람보다 그 아이디어를 실제로 돌아가게 만드는 사람에 가깝습니다. 누군가 멋진 계획을 이야기하고 있을 때 당신 머릿속에서는 이미 “그래서 누가 연락하지?”, “시간은 언제 잡지?”, “자료는 어디서 구하지?” 같은 현실적인 문제가 떠오릅니다. 결국 아무도 하지 않으면 자신이 처리하는 경우도 많습니다.","책임감이 강하지만 그것을 거창하게 표현하지는 않습니다. 귀찮다고 말하고 한숨도 쉬지만, 맡은 일을 그대로 방치하면 오히려 더 신경 쓰입니다. 그래서 불평하면서도 결국 끝까지 해내는 경우가 많습니다. 주변 사람들은 이런 성향을 빠르게 알아채기 때문에 시간이 지나면 자연스럽게 일이 당신에게 몰릴 수도 있습니다.","당신은 위기에서도 비교적 현실적인 판단을 유지합니다. 완벽한 해결책을 찾기보다 지금 가능한 방법 가운데 가장 괜찮은 것을 선택하고, 문제가 생기면 다시 수정합니다. 뛰어난 한 번의 판단보다 계속해서 작은 문제를 처리하는 능력이 강합니다. 이런 사람은 눈에 잘 띄지 않아도 조직이나 팀에서 빠지면 바로 티가 납니다.","당신의 약점은 너무 잘 버틴다는 것입니다. 피곤해도 할 수 있고, 귀찮아도 할 수 있고, 다른 사람이 안 하면 자신이 하면 된다고 생각합니다. 그래서 자신이 이미 지쳤다는 사실을 뒤늦게 깨닫는 경우가 있습니다. 모든 일을 끝내는 것보다, 애초에 어떤 일을 맡지 않을지를 결정하는 능력이 당신에게는 더 중요할 수 있습니다."],"worldCta":"신기가 고생하는 세계 보기"},"삼랑":{"title":"흐름을 읽고 살아남는 적응자","quote":"일단 살아남고 봅시다. 폼은 나중에 다시 잡으면 되니까.","desc":"처음 세운 계획보다 지금 무엇이 가장 유리한지를 봅니다. 새로운 도구와 상황에 빨리 적응하고, 필요하면 태도도 곧바로 바꿉니다.","strength":["매우 빠른 적응과 순발력","새로운 도구를 겁내지 않음","상황과 사람에 맞게 표현을 조절"],"risk":["한 가지를 오래 붙드는 힘은 약할 수 있음","가능성이 사라지면 관심도 빨리 이동할 수 있음"],"image":"assets/characters/samrang.webp","titleLines":["흐름을 읽고 살아남는","적응자"],"descParas":["당신은 상황이 변했을 때 빠르게 적응하는 사람입니다. 처음에 세운 계획이나 원칙을 무조건 지키기보다 “지금 이 상황에서는 무엇이 가장 유리하지?”를 생각합니다. 필요하다면 자신의 태도나 방법도 금방 바꿀 수 있고, 새로운 도구나 환경에도 비교적 빠르게 익숙해지는 편입니다.","사람들에게 자신이 어떻게 보이는지에도 꽤 민감할 가능성이 있습니다. 단순히 허영심 때문이라기보다, 분위기와 상대의 반응을 읽고 그에 맞는 모습을 보여주는 능력이 좋은 편입니다. 어떤 사람 앞에서는 진지해지고, 어떤 사람 앞에서는 농담을 하며, 필요하다면 자신을 더 능력 있어 보이게 연출할 수도 있습니다. 이 능력은 사회적 상황이나 협상에서는 상당한 강점이 됩니다.","위험한 상황에서는 특히 현실적입니다. 자존심이나 체면 때문에 잘못된 선택을 계속하기보다 상황이 불리하다고 판단하면 빠르게 방향을 바꿉니다. 그래서 겉으로는 가볍고 즉흥적으로 보이지만 실제로는 생존 감각이 상당히 좋은 편입니다. 다른 사람들이 계획 실패 자체에 충격받고 있을 때 이미 다음 방법을 찾고 있을 가능성이 높습니다.","반면 한 가지 일에 아주 오래 매달리는 힘은 상대적으로 약할 수 있습니다. 새로운 가능성이 보이면 관심이 이동하고, 재미나 의미가 사라진 일에는 에너지를 계속 투입하기 어렵습니다. 당신의 장점은 변화를 두려워하지 않는 것이지만, 때로는 변화하지 않고 버티는 것이 더 좋은 선택일 수도 있습니다."],"worldCta":"삼랑이 카메라를 켜는 세계 보기"},"중기":{"title":"사고가 나기 전에 막아놓는 관리자","quote":"문제가 생기고 나서 해결하는 것보다, 처음부터 안 생기게 하면 됩니다.","desc":"위기에서 예방과 대비를 먼저 생각합니다. 당장의 문제뿐 아니라 두 번째 사고까지 예상하며, 사람을 지키기 위한 규칙과 절차를 만듭니다.","strength":["사전 대비와 위험 관리","침착한 책임감","눈에 띄지 않아도 끝까지 관리"],"risk":["안전장치가 타인에게 간섭처럼 느껴질 수 있음","예상 밖의 변화에 다소 보수적일 수 있음"],"image":"assets/characters/junggi.webp","titleLines":["사고가 나기 전에 막아놓는","관리자"],"descParas":["당신은 사고가 난 뒤 해결하는 것보다, 애초에 사고가 나지 않도록 만드는 사람입니다. 다른 사람들이 눈앞의 문제를 처리하고 있을 때 당신은 자연스럽게 “그다음에는 어떤 문제가 생길 수 있지?”를 생각합니다. 그래서 사전에 준비하고 확인하고, 가능한 위험을 미리 제거하는 데 강합니다.","규칙과 절차를 중요하게 생각하는 편이지만 단순히 질서를 좋아해서만은 아닙니다. 당신에게 규칙은 사람을 보호하기 위한 장치에 가깝습니다. 누군가 다칠 가능성이 있다면 조금 불편하더라도 안전한 방법을 선택하고, 책임을 맡았다면 가능한 변수를 미리 확인해두려 합니다. 주변에서는 가끔 지나치게 신중하거나 답답하다고 느낄 수도 있지만, 실제 문제가 생겼을 때 가장 먼저 당신이 준비한 것이 도움이 되는 경우가 많습니다.","감정을 크게 드러내지 않는 편이고, 상황이 심각할수록 오히려 더 침착해질 가능성이 있습니다. 다른 사람들이 흥분하면 자신이 중심을 잡아야 한다고 느끼기 때문입니다. 누군가를 보호하고 싶다는 마음도 말보다 관리와 준비로 표현하는 편입니다. 필요한 물건을 챙겨두거나, 일정과 동선을 확인하거나, 위험한 상황을 미리 피하도록 만드는 식입니다.","당신의 가장 큰 장점은 사람들이 문제를 인식하기 전에 이미 문제를 줄여놓는 능력입니다. 다만 모든 위험을 미리 막으려고 하면 변화 자체를 부담스럽게 느끼거나 다른 사람의 선택까지 지나치게 관리하려 들 수 있습니다. 때로는 완벽하게 준비되지 않은 상황에서도 움직여야 합니다. 당신에게 필요한 것은 계획을 포기하는 것이 아니라, 계획 밖의 세계도 어느 정도 견딜 수 있다는 확신일지도 모릅니다."],"worldCta":"중기가 대비하는 세계 보기"}},"axisNames":{"Q":"탐구성","P":"설계성","A":"돌파성","G":"보호성","D":"집요성","F":"유연성","E":"표현성"},"scoreMeans":{"자별":7.5,"행":8.25,"도경":5.5,"은황":5.25,"금황":5.75,"범준":4.5,"아유":6.25,"신기":1.75,"삼랑":6.0,"중기":5.25},"scoreSds":{"자별":3.724916106437835,"행":3.7332961307670196,"도경":2.9154759474226504,"은황":3.010398644698074,"금황":3.092329219213245,"범준":2.7838821814150108,"아유":3.491060010942235,"신기":1.8874586088176875,"삼랑":3.29772648956823,"중기":3.2113081446662823},"axisMax":{"Q":23,"P":24,"A":19,"G":20,"D":16,"F":18,"E":20}};
</script>
<script>
const D=window.TEST_DATA, app=document.getElementById("app");
let idx=0, chosen=[], axisRaw={Q:0,P:0,A:0,G:0,D:0,F:0,E:0};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function topicParticle(word){const last=[...String(word)].pop();if(!last)return "는";const code=last.charCodeAt(0);if(code>=0xAC00&&code<=0xD7A3)return ((code-0xAC00)%28)!==0?"은":"는";return "는"}
function home(){app.innerHTML=`<main class="screen home-v4" id="homeScreen"><div class="home-grain"></div><div class="doorframe"></div><div class="red-thread"></div><div class="threshold"></div><div class="home-inner"><div class="eyebrow">당신이라면 살아남을 수 있을까</div><h1 class="home-title">K-오컬트<br>생존유형 테스트</h1><p class="home-sub">금기를 마주친 당신은<br>어떻게 살아남을까?</p><div class="home-meta"><span>14개의 상황</span><span>약 3분</span><span>10가지 유형</span></div><div class="warning-card">낯선 사람이 이름을 먼저 알고 있다면<br>문을 열지 마십시오.</div><button class="threshold-btn" onclick="crossThreshold()">문턱을 넘는다</button><div class="home-foot">정답은 없습니다. 아마도.</div></div></main>`}
function crossThreshold(){const s=document.getElementById("homeScreen");if(s)s.classList.add("entering");setTimeout(briefing,420)}
function briefing(){app.innerHTML=`<main class="screen briefing-screen"><section class="briefing-card"><div class="eyebrow">문턱을 넘기 전에</div><h2>이곳의 규칙을<br>먼저 알려드립니다.</h2><div class="briefing-copy"><p>이곳에서는 귀신과 요괴, 오래된 금기가 실제로 존재합니다.</p><p>이해할 수 없는 현상도 때로는 분명한 규칙을 따릅니다.</p><div class="briefing-divider"></div><p>정답을 찾으려 하지 마십시오.<br><strong>그 순간 당신이 가장 먼저 할 행동 하나를 선택하십시오.</strong></p></div><p class="briefing-note">당신이 무엇을 두려워하는지가 아니라,<br>두려울 때 무엇을 하는지를 봅니다.</p><button class="threshold-btn briefing-btn" onclick="start()">첫 번째 상황으로</button></section></main>`}
function start(){idx=0;chosen=[];axisRaw={Q:0,P:0,A:0,G:0,D:0,F:0,E:0};question()}
function question(){const q=D.questions[idx];app.innerHTML=`<main class="screen"><div class="top"><div class="progress"><i style="width:${((idx+1)/D.questions.length)*100}%"></i></div><div class="count">${String(idx+1).padStart(2,"0")} / 14</div></div><section class="question"><div class="eyebrow">금기를 마주한 순간</div><h2>${esc(q.q)}</h2>${q.sub?`<p class="sub">${esc(q.sub)}</p>`:""}<div class="answers">${q.answers.map((a,i)=>`<button class="answer" onclick="pick(${i})"><b>${"ABCD"[i]}</b><span>${esc(a.text)}</span></button>`).join("")}</div></section>${idx?`<button class="back" onclick="prev()">← 이전 질문</button>`:""}</main>`}
function rebuildAxes(){axisRaw={Q:0,P:0,A:0,G:0,D:0,F:0,E:0};chosen.forEach((oi,qi)=>{Object.entries(D.questions[qi].answers[oi].axes).forEach(([k,v])=>axisRaw[k]+=v)})}
function pick(i){chosen[idx]=i;rebuildAxes();if(idx<13){idx++;question()}else analyze()}
function prev(){if(idx>0){idx--;chosen=chosen.slice(0,idx);rebuildAxes();question()}}
function analyze(){app.innerHTML=`<main class="screen analysis"><div class="pulse"></div><div class="eyebrow">문턱을 넘었습니다</div><h2 id="anText">선택을 확인하고 있습니다.</h2><p class="sub">잠시 뒤 당신의 생존 방식이 드러납니다.</p></main>`;setTimeout(()=>{document.getElementById("anText").textContent="살아남는 방식에는 저마다 다른 매듭이 있습니다."},700);setTimeout(showResult,1450)}
function calcCharacters(){let raw={};Object.keys(D.profiles).forEach(c=>raw[c]=0);chosen.forEach((oi,qi)=>{const a=D.questions[qi].answers[oi];raw[a.primary]+=3;raw[a.secondary]+=1});let z={};Object.keys(raw).forEach(c=>z[c]=(raw[c]-D.scoreMeans[c])/D.scoreSds[c]);const ranked=Object.keys(z).map(c=>({name:c,z:z[c],raw:raw[c]})).sort((a,b)=>b.z-a.z);const topZ=ranked[0].z,gap12=Math.max(0,topZ-ranked[1].z),gap23=Math.max(0,ranked[1].z-ranked[2].z);ranked[0].sim=Math.max(82,Math.min(92,84+Math.round(Math.tanh(Math.max(0,topZ))*7)));ranked[1].sim=Math.max(60,Math.min(78,ranked[0].sim-10-Math.round(gap12*5)));ranked[2].sim=Math.max(48,Math.min(70,ranked[1].sim-7-Math.round(gap23*4)));for(let i=3;i<ranked.length;i++)ranked[i].sim=Math.max(35,ranked[2].sim-(i-2)*5);return ranked}
function calcAxes(){const out={};Object.keys(D.axisNames).forEach(k=>{const r=axisRaw[k]/D.axisMax[k];out[k]=Math.max(0,Math.min(100,Math.round(100*Math.sqrt(r))))});return out}
function showResult(){const ranks=calcCharacters(),top=ranks[0],p=D.profiles[top.name],axes=calcAxes();const axisRows=Object.keys(D.axisNames).map(k=>`<div class="barRow"><span>${D.axisNames[k]}</span><div class="bar"><i style="width:${axes[k]}%"></i></div><strong>${axes[k]}</strong></div>`).join("");const strengths=p.strength.map(x=>`<li>${esc(x)}</li>`).join("");const risks=p.risk.map(x=>`<li>${esc(x)}</li>`).join("");const media=p.image?`<div class="sheetWrap"><img class="sheetImage" src="${p.image}" alt="${esc(top.name)} 결과 장면"></div>`:`<div class="avatar">${esc(top.name.slice(-1))}</div>`;app.innerHTML=`<main class="screen result"><section class="heroResult"><div class="typeLabel">당신의 K-오컬트 생존유형</div><div class="typeTitle">${(p.titleLines||[p.title]).map(x=>`<span class="line">${esc(x)}</span>`).join("")}</div><div class="quote">“${esc(p.quote)}”</div></section><section class="reveal">${media}<div class="eyebrow">당신과 가장 닮은 인물</div><div class="name">${esc(top.name)}</div><div class="book">K-오컬트 소설 《매듭 문지방을 넘어온 것들》</div><div class="sim">유사도 <strong>${top.sim}%</strong></div></section><section class="section"><h3>당신의 생존 성향</h3>${axisRows}</section><section class="section analysisText"><h3>당신은 이런 사람입니다</h3>${(p.descParas||[p.desc]).map(t=>`<p>${esc(t)}</p>`).join("")}</section><section class="section"><div class="cards"><div class="smallCard"><b>강한 상황</b><ul class="list">${strengths}</ul></div><div class="smallCard"><b>위험한 순간</b><ul class="list">${risks}</ul></div></div></section><section class="section"><h3>당신 안의 다른 생존자</h3>${ranks.slice(1,3).map((r,i)=>`<div class="smallCard rank"><div><b>${i+2}위 · ${esc(r.name)}</b><small>${esc(D.profiles[r.name].title)}</small></div><span>${r.sim}%</span></div>`).join("")}</section><section class="section actions"><button class="shareBtn" onclick="shareResult()">결과 공유하기</button><button class="ghost" onclick="downloadCard()">결과 이미지 저장</button><button class="ghost" onclick="shareTest()">친구에게 테스트 보내기</button><button class="ghost" onclick="start()">다시 테스트하기</button><div class="share-note">공유용 카드에는 캐릭터 장면 위에 유형명·인물명·유사도가 KoPub바탕으로 자동 합성됩니다.</div></section><section class="section bookCta"><div class="eyebrow">그런데 ${esc(top.name)}${topicParticle(top.name)} 누구일까요?</div><h3>소설 《매듭 문지방을 넘어온 것들》</h3><p>귀신과 요괴가 현실의 틈으로 스며드는 한국. 그 세계에서 살아가는 사람들의 이야기.</p><button class="ghost" onclick="goToWorld()">${esc(p.worldCta||"《매듭》 세계 보기")}</button></section></main>`;window.__result={ranks,top,p,axes};window.scrollTo(0,0)}
function cleanTestUrl(){if(location.protocol==='http:'||location.protocol==='https:')return location.origin+location.pathname;return ''}
function shareCopy(){const {top,p}=window.__result;return `나는 K-오컬트 생존유형 ‘${p.title}’ — ${top.name}형 ${top.sim}% 나옴. 너는?`}
function shareTest(){const text='K-오컬트 생존유형 테스트. 금기를 마주친다면 당신은 어떻게 살아남을까?';const url=cleanTestUrl();if(navigator.share){navigator.share({title:'K-오컬트 생존유형 테스트',text,url:url||undefined}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(text+(url?' '+url:''));toast('테스트 공유 문구를 복사했습니다.')}else toast('브라우저의 공유 기능을 이용해주세요.')}
function toast(t){const n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),1900)}
function roundedPath(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight,maxLines=4){let chars=[...text],line='',lines=[];for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=ch}else line=test}if(line)lines.push(line);lines=lines.slice(0,maxLines);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));return y+lines.length*lineHeight}
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
async function ensureShareFont(){try{if(document.fonts&&document.fonts.load){await document.fonts.load('700 68px "KoPubWorld Batang"');await document.fonts.ready}}catch(e){}}
async function buildShareBlob(){const {top,p}=window.__result;await ensureShareFont();const c=document.getElementById('shareCanvas'),ctx=c.getContext('2d');c.width=1080;c.height=1350;ctx.clearRect(0,0,c.width,c.height);const font='"KoPubWorld Batang","KoPub Batang",Batang,serif';ctx.fillStyle='#110e0c';ctx.fillRect(0,0,c.width,c.height);const bg=ctx.createRadialGradient(190,100,10,190,100,800);bg.addColorStop(0,'rgba(116,39,27,.42)');bg.addColorStop(1,'rgba(17,14,12,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='rgba(180,147,88,.7)';ctx.lineWidth=2;roundedPath(ctx,54,54,972,1242,30);ctx.stroke();ctx.textAlign='left';ctx.fillStyle='#ad9361';ctx.font=`400 27px ${font}`;ctx.fillText('당신의 K-오컬트 생존유형',88,118);ctx.fillStyle='#f0e7d8';ctx.font=`700 66px ${font}`;let y=212;for(const line of (p.titleLines||[p.title])){ctx.fillText(line,88,y);y+=78}ctx.fillStyle='#cbbdac';ctx.font=`400 30px ${font}`;y=wrapCanvasText(ctx,'“'+p.quote+'”',88,y+18,900,44,3);if(p.image){try{const im=await loadImage(p.image),box={x:88,y:y+26,w:904,h:510};const ir=im.width/im.height,br=box.w/box.h;let sx=0,sy=0,sw=im.width,sh=im.height;if(ir>br){sw=im.height*br;sx=(im.width-sw)/2}else{sh=im.width/br;sy=(im.height-sh)/2}ctx.save();roundedPath(ctx,box.x,box.y,box.w,box.h,24);ctx.clip();ctx.drawImage(im,sx,sy,sw,sh,box.x,box.y,box.w,box.h);const shade=ctx.createLinearGradient(0,box.y,0,box.y+box.h);shade.addColorStop(.52,'rgba(0,0,0,0)');shade.addColorStop(1,'rgba(0,0,0,.52)');ctx.fillStyle=shade;ctx.fillRect(box.x,box.y,box.w,box.h);ctx.restore();y=box.y+box.h}catch(e){}}ctx.textAlign='center';ctx.fillStyle='#b59a66';ctx.font=`400 25px ${font}`;ctx.fillText('당신과 가장 닮은 인물',540,y+62);ctx.fillStyle='#f1e8da';ctx.font=`700 55px ${font}`;ctx.fillText(top.name,540,y+126);ctx.font=`400 32px ${font}`;ctx.fillText(`유사도 ${top.sim}%`,540,y+177);ctx.fillStyle='#a99b88';ctx.font=`400 24px ${font}`;ctx.fillText('K-오컬트 소설 《매듭 문지방을 넘어온 것들》',540,y+224);ctx.fillStyle='#766d62';ctx.font=`400 19px ${font}`;ctx.fillText('금기를 마주친 당신은 어떻게 살아남을까?',540,1262);return new Promise(resolve=>c.toBlob(resolve,'image/png',.96))}
function downloadBlob(blob,filename){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}
async function downloadCard(){const {top}=window.__result;const blob=await buildShareBlob();if(!blob)return toast('이미지를 만들지 못했습니다.');downloadBlob(blob,`K오컬트_생존유형_${top.name}.png`)}
async function shareResult(){const {top}=window.__result;const blob=await buildShareBlob();if(!blob)return toast('공유 이미지를 만들지 못했습니다.');const file=new File([blob],`K오컬트_생존유형_${top.name}.png`,{type:'image/png'});const text=shareCopy(),url=cleanTestUrl();try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'K-오컬트 생존유형 테스트',text,url:url||undefined,files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}downloadBlob(blob,file.name);try{if(navigator.clipboard)await navigator.clipboard.writeText(text+(url?' '+url:''))}catch(e){}toast('공유 이미지를 저장했습니다. 공유 문구도 복사했습니다.')}
function goToWorld(){const {top}=window.__result;location.href=`./index.html?type=${encodeURIComponent(top.name)}&score=${top.sim}`}
home();
</script>
