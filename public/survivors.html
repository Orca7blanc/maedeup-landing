/* ===== V7 ALL BOLD preview =====
   모든 텍스트를 KoPub 바탕 Bold(700)로 강제 적용 */
html,body,
h1,h2,h3,h4,h5,h6,
p,span,small,strong,b,em,i,
div,a,button,label,li,dt,dd,
input,textarea,select,option,
blockquote,cite,figcaption {
  font-family:"KoPubWorld Batang","KoPub Batang",Batang,serif !important;
  font-weight:700 !important;
}

input::placeholder,
textarea::placeholder{
  font-family:"KoPubWorld Batang","KoPub Batang",Batang,serif !important;
  font-weight:700 !important;
}

body{
  font-weight:700 !important;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

  .navlinks,.navcta,.eyebrow,.kicker,.scene-no,.char-no,.recent-meta,.shop-name,
  .home-meta,.count,.share-note,.chip,.sortBtn,.serial,.when,.nick,.score,.like{
    font-size:max(1em, 15px) !important;
  }
}

</style>
</head>
<body>
<header class="nav"><div class="wrap navin"><a class="logo" href="./index.html">매듭</a><a class="navcta" href="./test.html">K오컬트 생존유형 테스트</a></div></header>
<main>
<section class="hero"><div class="wrap"><div class="eyebrow">SURVIVORS BEYOND THE THRESHOLD</div><h1>문턱을 넘은 사람들</h1><p>《매듭》의 세계에서<br>당신은 어떻게 살아남았습니까?</p><div class="countline" id="countline">첫 생존 기록을 기다리고 있습니다.</div><div class="heroActions"><button class="primaryBtn mokBtn primary" onclick="openShare()">내 결과 남기기</button><a class="quietBtn mokBtn secondary" href="./test.html">테스트 하러 가기</a></div></div></section>
<section class="board"><div class="wrap"><div class="toolbar"><div class="filters" id="filters"></div><div class="sorts"><button class="sortBtn active" data-sort="latest">최신순</button><button class="sortBtn" data-sort="popular">인기순</button></div></div><div class="boardStatus">현재 버전은 화면·동선 확인용 프로토타입입니다. 실제 공개 DB를 연결하기 전까지 등록한 글은 이 브라우저에만 저장됩니다.</div><div class="cards" id="cards"></div><div class="board-return"><a href="./index.html">《매듭》 랜딩페이지로 돌아가기</a></div></div></section>
</main>
<footer class="foot"><div class="wrap footin"><span>《매듭》 · 이자운</span><span><a href="https://m.blog.naver.com/orca7blanc" target="_blank" rel="noopener noreferrer">작가의 기록</a> · <a href="./index.html">랜딩페이지로 돌아가기</a></span></div></footer>
<div class="modalBackdrop" id="modalBackdrop" onclick="backdropClose(event)"><div class="modal" id="modal"><div id="modalContent"></div></div></div>
<script>
const PENDING='maedeup_pending_result_v1';
const NAMES=['전체','자별','행','도경','은황','금황','범준','아유','신기','삼랑','중기'];
const TITLE={자별:'판을 다시 짜는 생존자',행:'끝없이 파고드는 탐구자',도경:'끝을 볼 때까지 파고드는 몰입자',은황:'두려워도 곁을 지키는 수호자',금황:'말없이 먼저 막아서는 실용가',범준:'정면으로 버티는 의리파',아유:'의문을 바로 쏘는 직설 탐색자',신기:'결국 끝까지 해내는 실무자',삼랑:'흐름을 읽고 살아남는 적응자',중기:'사고가 나기 전에 막아놓는 관리자'};
let filter='전체',sort='latest',currentRows=[];
const $=q=>document.querySelector(q),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function pending(){try{return JSON.parse(localStorage.getItem(PENDING)||'null')}catch(e){return null}}
function clientId(){let x=localStorage.getItem('maedeup_client_id_v1');if(!x){x=(crypto.randomUUID?crypto.randomUUID():'c'+Date.now().toString(36)+Math.random().toString(36).slice(2));localStorage.setItem('maedeup_client_id_v1',x)}return x}
function renderFilters(){const host=$('#filters');host.innerHTML=NAMES.map(n=>`<button class="chip ${n===filter?'active':''}" onclick="setFilter('${n}')">${n}</button>`).join('')}
function setFilter(n){filter=n;renderFilters();loadRows()}
function setSort(n){sort=n;document.querySelectorAll('.sortBtn').forEach(b=>b.classList.toggle('active',b.dataset.sort===n));loadRows()}
document.querySelectorAll('.sortBtn').forEach(b=>b.addEventListener('click',()=>setSort(b.dataset.sort)));
async function loadRows(){
  const host=$('#cards');host.innerHTML='<div class="empty">생존 기록을 불러오는 중입니다.</div>';
  const qs=new URLSearchParams({limit:'60',sort,client_id:clientId()}); if(filter!=='전체')qs.set('type',filter);
  try{
    const r=await fetch('/api/survivors?'+qs.toString(),{headers:{accept:'application/json'}});
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error||'게시판 연결 오류');
    currentRows=Array.isArray(data.rows)?data.rows:[];
    $('#countline').innerHTML=data.total?`지금까지 <strong>${data.total}명</strong>이 문턱을 넘었습니다.`:'첫 생존 기록을 기다리고 있습니다.';
    const status=document.querySelector('.boardStatus'); if(status) status.textContent='테스트를 완료한 결과만 등록할 수 있습니다. 닉네임과 한마디는 공개됩니다.';
    render();
  }catch(e){
    currentRows=[];$('#countline').textContent='게시판 연결을 확인하고 있습니다.';
    const status=document.querySelector('.boardStatus'); if(status) status.textContent='Cloudflare D1 연결 후 모든 방문자가 같은 게시판을 보게 됩니다.';
    host.innerHTML='<div class="empty">게시판 데이터베이스 연결을 확인하고 있습니다.<br><small>'+esc(e.message)+'</small></div>';
  }
}
function render(){const host=$('#cards');if(!currentRows.length){host.innerHTML=`<div class="empty">아직 등록된 생존 기록이 없습니다.<br><button class="quietBtn mokBtn secondary" onclick="openShare()">내 결과 남기기</button></div>`;return}
  host.innerHTML=currentRows.map((x,i)=>`<article class="post"><div class="postTop"><span class="serial">${String(i+1).padStart(2,'0')}</span><span class="when">${when(x.created_at)}</span></div><div class="char">${esc(x.result_type)}${x.score!=null?` · ${x.score}%`:''}</div><div class="type">${esc(x.result_title||TITLE[x.result_type]||'생존자')}</div><div class="nick">${esc(x.nickname||'무명')}</div><div class="comment">“${esc(x.comment||'기록을 남겼습니다.')}”</div><div class="postBottom"><span class="score">K-오컬트 생존유형</span><button class="like ${x.liked?'liked':''}" onclick="like(${Number(x.id)})">♡ ${Number(x.likes||0)}</button></div></article>`).join('')}
function when(t){const d=new Date(t),diff=Date.now()-d;if(!isFinite(diff))return'최근';if(diff<60000)return'방금 전';if(diff<3600000)return`${Math.max(1,Math.floor(diff/60000))}분 전`;if(diff<86400000)return`${Math.floor(diff/3600000)}시간 전`;return`${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}`}
async function like(id){try{const r=await fetch('/api/like',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({post_id:id,client_id:clientId()})});const data=await r.json();if(!r.ok)throw new Error(data.error||'좋아요 실패');await loadRows()}catch(e){alert(e.message)}}
function openShare(){const p=pending();$('#modalBackdrop').classList.add('show');document.body.style.overflow='hidden';if(!p||!p.name){$('#modalContent').innerHTML=`<div class="modalHead"><div><div class="eyebrow">YOUR RESULT</div><h2>먼저 문턱을 넘어주세요.</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="gate">게시판에는 테스트를 완료한 결과만 남길 수 있습니다.<div class="resultGateBtn"><a class="quietBtn mokBtn secondary" href="./test.html">테스트 하러 가기</a></div></div>`;return}
  $('#modalContent').innerHTML=`<div class="modalHead"><div><div class="eyebrow">LEAVE YOUR TRACE</div><h2>결과를 남깁니다.</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="resultPreview"><b>당신의 결과</b><strong>${esc(p.name)}</strong><span>${esc(p.title||TITLE[p.name]||'생존자')}${p.score!=null?` · 유사도 ${esc(p.score)}%`:''}</span></div><form onsubmit="submitPost(event)"><div class="field"><label>닉네임 · 최대 12자</label><input id="nickname" maxlength="12" placeholder="무명" autocomplete="off"></div><div class="field"><label>한마디 · 최대 60자</label><textarea id="comment" maxlength="60" placeholder="테스트 결과에 대한 한마디를 남겨주세요." oninput="countChars()"></textarea><div class="counter" id="counter">0 / 60</div></div><label class="consent"><input id="consent" type="checkbox" required><span>내 테스트 결과와 입력한 내용을 공개 게시판에 표시하는 데 동의합니다.</span></label><div class="modalActions"><button class="primaryBtn mokBtn primary" type="submit">문턱 너머에 남기기</button><button class="quietBtn mokBtn secondary" type="button" onclick="closeModal()">취소</button></div></form>`}
function countChars(){const e=$('#comment');if(e)$('#counter').textContent=`${e.value.length} / 60`}
async function submitPost(e){e.preventDefault();const p=pending();if(!p)return;const nickname=($('#nickname').value||'무명').trim().slice(0,12)||'무명';const comment=($('#comment').value||'').trim().slice(0,60)||'결과를 남겼습니다.';const token=`${clientId()}|${p.name}|${p.score}|${p.createdAt||''}`;try{const r=await fetch('/api/survivors',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({result_type:p.name,score:Number(p.score),nickname,comment,share_token:token})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'등록 실패');closeModal();filter='전체';sort='latest';renderFilters();document.querySelectorAll('.sortBtn').forEach(b=>b.classList.toggle('active',b.dataset.sort==='latest'));await loadRows();window.scrollTo({top:document.querySelector('.board').offsetTop-56,behavior:'smooth'})}catch(err){alert(err.message)}}
function closeModal(){$('#modalBackdrop').classList.remove('show');document.body.style.overflow=''}
function backdropClose(e){if(e.target.id==='modalBackdrop')closeModal()}
renderFilters();loadRows();if(new URLSearchParams(location.search).get('share')==='1')setTimeout(openShare,120);
</script>
</body>
</html>
